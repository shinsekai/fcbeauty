server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: every unknown path serves the app shell
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Runtime settings are generated at container start: never cache them
  location = /runtime-config.js {
    add_header Cache-Control "no-cache";
  }

  # Long cache for hashed build assets and images
  location ~* \.(?:js|css|jpg|jpeg|png|svg|webp|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
  }
}
